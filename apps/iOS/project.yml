name: SonosAnnounce
options:
  bundleIdPrefix: com.dtrouton
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  SonosKit:
    path: ../..
targets:
  SonosAnnounce:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SonosKit
        product: SonosKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtrouton.sonosannounce
        DEVELOPMENT_TEAM: FF3XH4ZJ45
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SonosAnnounce-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
